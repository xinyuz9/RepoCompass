name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.12 · tests, coverage, package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Linux sandbox runtime
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes bubblewrap
          fi
          bwrap --version
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test with coverage floor
        run: >-
          uv run pytest
          --cov=repocompass
          --cov-report=term-missing:skip-covered
          --cov-fail-under=85
          -q
      - name: Build package
        run: uv build
      - name: Install optional static browser runtime
        run: |
          uv sync --locked --all-groups --extra browser
          uv run --extra browser playwright install --with-deps --only-shell chromium
      - name: Verify actual isolated browser (no provider credentials)
        env:
          REPOCOMPASS_BROWSER_TESTS: "1"
        run: uv run --extra browser pytest -q tests/integration/test_static_browser.py
      - name: Smoke installed entry points
        run: |
          uv venv .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python dist/*.whl
          .wheel-smoke/bin/repocompass-dashboard --help
          .wheel-smoke/bin/repocompass-mcp --help
          .wheel-smoke/bin/repocompass-improve --help

  ui:
    name: Node 24 · tests, axe, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependency tree
        run: npm audit --audit-level=high
      - name: Test UI and accessibility contracts
        run: npm test
      - name: Test recording safety and evidence contracts
        run: npm run test:recording
      - name: Lint UI
        run: npm run lint
      - name: Build packaged SPA
        run: npm run build
      - name: Verify committed static bundle
        working-directory: .
        run: git diff --exit-code -- src/repocompass/dashboard/static
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install dashboard runtime
        working-directory: .
        run: uv sync --locked
      - name: Install Chromium for browser acceptance
        run: npx playwright install --with-deps --only-shell chromium
      - name: Install Chinese fonts for bilingual visual acceptance
        run: sudo apt-get install -y fonts-noto-cjk
      - name: Exercise real demo across four viewports
        run: npm run test:e2e
      - name: Exercise real HTTP cancellation with a local scripted model
        run: npm run test:e2e:cancellation
      - name: Reconcile real crashed workers without model replay
        run: npm run test:e2e:recovery
      - name: Verify quick and detailed modes
        run: npx playwright test --config playwright.modes.config.ts
      - name: Retain browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-browser-evidence
          path: |
            ui/test-results/
            ui/test-results-cancellation/
            ui/test-results-recovery/
            ui/test-results-modes/

  docker:
    name: Docker image and runtime boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Verify built image without provider calls
        env:
          REPOCOMPASS_RUN_DOCKER_TESTS: "1"
        run: uv run pytest -q tests/integration/test_docker_image.py
