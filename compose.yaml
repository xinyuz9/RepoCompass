services:
  repocompass:
    image: repocompass:local
    build:
      context: .
      target: runtime
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:${REPOCOMPASS_PORT:-8767}:8766"
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    pids_limit: 128
    mem_limit: 1g
    stop_grace_period: 30s
