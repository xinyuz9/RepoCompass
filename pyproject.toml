[project]
name = "repocompass"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "xinyuz9", email = "152044466+xinyuz9@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-openai>=1.3.5",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
repocompass = "repocompass.cli:main"
repocompass-benchmark = "repocompass.evaluation.cli:main"
repocompass-memory-benchmark = "repocompass.evaluation.memory_cli:main"
repocompass-live-smoke = "repocompass.evaluation.live_smoke:main"
repocompass-localization-benchmark = "repocompass.evaluation.localization_cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.31",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
markers = [
    "live_api: explicitly enabled tests that spend real provider credits",
]
