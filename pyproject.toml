[project]
name = "repocompass"
version = "0.1.0"
description = "Evidence-grounded repository investigation agent with bounded tools, memory, evaluation, MCP, observability, and opt-in sandboxed focused improvements"
readme = "README.md"
authors = [
    { name = "xinyuz9", email = "152044466+xinyuz9@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-openai>=1.3.5",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "mcp>=2.1.1,<3.0.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.51.0",
]

[project.optional-dependencies]
improve = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[project.scripts]
repocompass = "repocompass.cli:main"
repocompass-benchmark = "repocompass.evaluation.cli:main"
repocompass-memory-benchmark = "repocompass.evaluation.memory_cli:main"
repocompass-live-smoke = "repocompass.evaluation.live_smoke:main"
repocompass-localization-benchmark = "repocompass.evaluation.localization_cli:main"
repocompass-localization-analyze = "repocompass.evaluation.localization_analysis_cli:analysis_main"
repocompass-localization-regression = "repocompass.evaluation.localization_analysis_cli:regression_main"
repocompass-mcp = "repocompass.mcp_server:main"
repocompass-dashboard = "repocompass.dashboard.runtime:main"
repocompass-improve = "repocompass.improve.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "langgraph-cli[inmem]>=0.4.31",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
norecursedirs = [
    ".git",
    ".venv",
    "node_modules",
    "benchmarks/cases",
]
markers = [
    "live_api: explicitly enabled tests that spend real provider credits",
]
